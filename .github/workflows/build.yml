name: Build Subway Brutal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install NDK, CMake, Platforms
        run: |
          set -e
          SDK=${ANDROID_SDK_ROOT}
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager "platform-tools" > /dev/null
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" > /dev/null
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" > /dev/null
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" > /dev/null
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$SDK/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "$SDK/cmake/3.22.1/bin" >> $GITHUB_PATH

      - name: Download Gradle 7.6.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-7.6.1/bin" >> $GITHUB_PATH

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      - name: Generate Gradle Wrapper
        run: |
          /opt/gradle-7.6.1/bin/gradle wrapper --gradle-version 7.6.1 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.NDK_HOME }}

      - name: Find and Rename APK
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" -type f
          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ NO APK FOUND!"
            exit 1
          fi
          echo "✅ Found APK at: $APK"
          mkdir -p /tmp/apk-output
          cp "$APK" /tmp/apk-output/SubwayBrutal-v1.0-debug.apk
          ls -la /tmp/apk-output/
          echo "APK_SIZE=$(du -h /tmp/apk-output/SubwayBrutal-v1.0-debug.apk | cut -f1)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubwayBrutal-APK
          path: /tmp/apk-output/SubwayBrutal-v1.0-debug.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
