name: Build Subway Brutal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install NDK, CMake, Platforms
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" > /dev/null
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" > /dev/null
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" > /dev/null
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Download Gradle 7.6.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-7.6.1/bin" >> $GITHUB_PATH
          /opt/gradle-7.6.1/bin/gradle --version

      - name: Generate Gradle Wrapper
        run: |
          /opt/gradle-7.6.1/bin/gradle wrapper --gradle-version 7.6.1 --distribution-type bin
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}

      - name: Find APK
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== Build outputs ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No outputs folder"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SubwayBrutal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
